name: Update silver spot

on:
  schedule:
    - cron: "0 13,17,21 * * 1-5"
    - cron: "0 16 * * 0,6"
  workflow_dispatch:

jobs:
  spot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch XAG and write data/spot.json
        run: |
          python3 - << 'PY'
          import json, urllib.request
          from datetime import datetime, timezone

          url = "https://api.gold-api.com/price/XAG"
          with urllib.request.urlopen(url, timeout=20) as r:
              d = json.load(r)

          price = round(float(d["price"]), 2)
          if price < 10 or price > 200:
              raise SystemExit(f"spot out of range: {price}")

          out = {
            "silver": price,
            "as_of": d.get("updatedAt") or datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "source": "gold-api.com XAG USD delayed",
            "note": "Indicative delayed silver spot. Not COMEX. Not a dealer quote."
          }
          with open("data/spot.json", "w") as f:
              json.dump(out, f, indent=2)
              f.write("\n")
          print(out)
          PY

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "spot: update silver"
          file_pattern: data/spot.json
          commit_user_name: troydesk-bot
          commit_user_email: hello@troydesk.com
