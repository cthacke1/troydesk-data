      - name: Build premiums.json from CSV
        run: |
          python3 - << 'PY'
          import csv, json
          from collections import defaultdict

          allowed_sku = {"ase", "silver_maple", "oz1_bar", "gold_eagle"}
          allowed_dealer = {"jm", "sd", "apmex", "money_metals", "monument", "bgasc"}
          allowed_avail = {"in_stock", "out_of_stock", "preorder"}

          skus = defaultdict(lambda: {"dealers": {}})

          with open("data/premiums.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))

          if not rows:
              raise SystemExit("premiums.csv is empty")

          for i, row in enumerate(rows, start=2):
              sku = (row.get("sku") or "").strip()
              dealer = (row.get("dealer") or "").strip()
              if sku not in allowed_sku:
                  raise SystemExit(f"line {i}: bad sku {sku!r}")
              if dealer not in allowed_dealer:
                  raise SystemExit(f"line {i}: bad dealer {dealer!r}")

              raw = (row.get("premium_usd") or "").strip()
              if raw == "":
                  prem = None
              else:
                  prem = round(float(raw), 2)
                  if sku == "gold_eagle":
                      lo, hi = -50, 500
                  else:
                      lo, hi = -5, 80
                  if prem < lo or prem > hi:
                      raise SystemExit(f"line {i}: premium out of range {prem}")

              avail = (row.get("availability") or "in_stock").strip()
              if avail not in allowed_avail:
                  raise SystemExit(f"line {i}: bad availability {avail!r}")
              if prem is None and avail == "in_stock":
                  avail = "out_of_stock"

              url = (row.get("url") or "").strip()
              if not url.startswith("http"):
                  raise SystemExit(f"line {i}: bad url")

              verified = (row.get("verified_at") or "").strip() or None

              skus[sku]["dealers"][dealer] = {
                  "premium_usd": prem,
                  "availability": avail,
                  "url": url,
                  "verified_at": verified,
              }

          order = ("ase", "silver_maple", "oz1_bar", "gold_eagle")
          out = {"skus": {k: skus[k] for k in order if k in skus}}
          with open("data/premiums.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2)
              f.write("\n")
          print("skus", list(out["skus"]))
          PY
